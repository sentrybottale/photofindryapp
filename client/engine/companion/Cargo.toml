[package]
name = "photofindry-companion"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "photofindry"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"
subtle = "2"
libc = "0.2"
base64 = "0.23"
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
