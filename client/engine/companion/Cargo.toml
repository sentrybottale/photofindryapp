[package]
name = "photofindry-companion"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "photofindry"
path = "src/main.rs"

# Linux/Windows release verifier; macOS packages the Swift CompanionReleaseVerify.
[[bin]]
name = "photofindry-release-verify"
path = "src/bin/release_verify.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"
subtle = "2"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
photofindry-platform = { path = "../platform" }
windows_api = { package = "windows", version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
