name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web-companion/frontend
      - run: npm test && npm run check
        working-directory: web-companion/frontend
      - run: python3 scripts/verify-web-frontend.py && node --test tests/*.test.js
  mac-client:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: swift test && swift build -c release --product PhotoFindryBrowserHost
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo test --locked --manifest-path engine/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - run: bash scripts/build-companion-tools.sh
