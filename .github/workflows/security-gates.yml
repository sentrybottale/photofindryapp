name: Public security gates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    name: Distribution boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - run: python3 ci/check_distribution.py
  analyze:
    name: Security analysis (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build: none
          - language: python
            runner: ubuntu-24.04
            build: none
          - language: javascript-typescript
            runner: ubuntu-24.04
            build: none
          - language: rust
            runner: macos-15
            build: none
          - language: swift
            runner: macos-15
            build: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - if: matrix.language != 'rust' && matrix.language != 'javascript-typescript' || matrix.language == 'rust' && hashFiles('client/engine/companion/Cargo.toml') != '' || matrix.language == 'javascript-typescript' && hashFiles('client/web-companion/frontend/package-lock.json') != ''
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - if: matrix.language == 'swift'
        run: |
          swiftc verify-release.swift -o "$RUNNER_TEMP/verify-release"
          if test -f client/Package.swift; then
            (cd client && swift build --product PhotoFindryBrowserHost && bash scripts/build-companion-tools.sh)
          fi
      - if: matrix.language == 'rust' && hashFiles('client/engine/companion/Cargo.toml') != ''
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked --manifest-path client/engine/Cargo.toml
      - if: matrix.language != 'rust' && matrix.language != 'javascript-typescript' || matrix.language == 'rust' && hashFiles('client/engine/companion/Cargo.toml') != '' || matrix.language == 'javascript-typescript' && hashFiles('client/web-companion/frontend/package-lock.json') != ''
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
  client:
    name: Client checks
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - if: hashFiles('client/web-companion/frontend/package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Qualify client only when its source is published
        run: |
          if test ! -f client/web-companion/frontend/package-lock.json; then
            echo 'Client source is not published. No client build qualification is claimed by this run.'
            exit 0
          fi
          cd client
          (cd web-companion/frontend && npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run check)
          python3 scripts/verify-web-frontend.py
          node --test tests/*.test.js
          swift test
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 test --locked --manifest-path engine/Cargo.toml
  required:
    name: Security checks
    if: always()
    needs: [distribution, analyze, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          BOUNDARY: ${{ needs.distribution.result }}
          ANALYSIS: ${{ needs.analyze.result }}
          CLIENT: ${{ needs.client.result }}
        run: test "$BOUNDARY" = success && test "$ANALYSIS" = success && test "$CLIENT" = success
