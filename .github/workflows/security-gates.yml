name: Public security gates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    name: Distribution boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - run: python3 ci/check_distribution.py
  analyze:
    name: Security analysis (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build: none
          - language: python
            runner: ubuntu-24.04
            build: none
          - language: swift
            runner: macos-15
            build: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - if: matrix.language == 'swift'
        run: swiftc verify-release.swift -o "$RUNNER_TEMP/verify-release"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
  required:
    name: Security checks
    if: always()
    needs: [distribution, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          BOUNDARY: ${{ needs.distribution.result }}
          ANALYSIS: ${{ needs.analyze.result }}
        run: test "$BOUNDARY" = success && test "$ANALYSIS" = success
